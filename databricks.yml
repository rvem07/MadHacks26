bundle:
  name: agent-watcher

sync:
  include:
    - data/org_chart.csv
    - data/responsibilities.csv
    - data/person_context.csv

variables:
  warehouse_id:
    description: Existing SQL warehouse ID
  catalog:
    default: workspace
  watcher_schema:
    default: sentinel_gold
  model_endpoint:
    default: databricks-qwen3-next-80b-a3b-instruct

resources:
  jobs:
    watcher_pipeline:
      name: Agent Watcher - bronze silver gold
      max_concurrent_runs: 1
      tasks:
        - task_key: publish_org_graph
          spark_python_task:
            python_file: ./scripts/run_pipeline.py
            parameters:
              - --sentinel
              - --delta
              - --bootstrap
              - --warehouse-id
              - ${var.warehouse_id}
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.watcher_schema}
          environment_key: pipeline
      environments:
        - environment_key: pipeline
          spec:
            environment_version: "2"
            dependencies:
              - databricks-sdk>=0.40
  apps:
    watcher:
      name: agent-watcher
      description: WildGuard Labs Sentinel incident investigation with grounded personas
      compute_max_instances: 1
      compute_min_instances: 1
      source_code_path: .
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: agent-model
          serving_endpoint:
            name: ${var.model_endpoint}
            permission: CAN_QUERY

targets:
  dev:
    default: true
