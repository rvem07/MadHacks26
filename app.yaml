# Databricks App. Local development: python -m afd (without this manifest).
command: ["python", "-m", "afd"]
env:
  - name: AFD_WORKFLOW
    value: watcher
  - name: AFD_DATA_DIR
    value: /tmp/afd-data
  - name: AFD_DELTA
    value: "1"
  - name: AFD_CATALOG
    value: workspace
  - name: AFD_WATCHER_SCHEMA
    value: agent_watcher
  - name: AFD_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: AFD_WATCHER_AGENT
    value: databricks
  - name: AFD_WATCHER_MODEL
    valueFrom: agent-model
  # Enable only after configuring a writable MLflow experiment for the app identity.
  - name: AFD_MLFLOW
    value: "0"
